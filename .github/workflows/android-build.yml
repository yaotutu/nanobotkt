# ============================================================
# NanobotKT 自动打包 workflow
# 作用：在推送到 main 分支后，自动构建 Android Debug APK
#       并上传为 GitHub Actions artifact（可直接下载安装调试）。
# 注意：本文件只负责 CI 打包，不修改任何应用源码。
# ============================================================
name: Android Debug Build

on:
  push:
    branches: [ main ]
  # PR 必须在合并前执行同一套测试、Lint 和 Debug 构建，避免只依赖本地验收。
  # Release workflow 仍只响应 main push，防止 PR 意外使用签名凭据或发布产物。
  pull_request:
    branches: [ main ]
  # 也允许在 GitHub Actions 页面手动触发（workflow_dispatch）
  workflow_dispatch:

# 只读权限足够：本 workflow 不需要写仓库内容
permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      # 1. 检出仓库代码（checkout 到当前提交）
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 JDK 17（AGP 9 / Gradle 9 需要 JDK 17+）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. 配置 Gradle（自动使用仓库 wrapper，并缓存依赖，加快后续构建）
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. 先执行全工程 JVM 单元测试，避免仅编译成功却漏掉通信和业务回归。
      - name: Run JVM unit tests
        run: sh gradlew test --console=plain

      # 5. Lint 是架构迁移的硬门禁，确保资源 API 兼容性和 Android 配置问题不会被构建掩盖。
      - name: Run Android lint
        run: sh gradlew :app:lintDebug --console=plain

      # 6. 构建 Debug APK（app 模块 assembleDebug）
      - name: Build debug APK
        run: sh gradlew :app:assembleDebug --console=plain

      # 6. 上传 APK 产物，可在 Actions 运行页面的 Artifacts 中下载
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanobotkt-debug-apk
          # 启用 ABI 拆分后 debug 产物为分架构 + universal 多个 APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
