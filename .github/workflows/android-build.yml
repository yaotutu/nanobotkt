# ============================================================
# NanobotKT Dev Release workflow
#
# dev 分支：读取本地已经准备好的版本，构建并更新 rolling 的 dev-latest 预发布版本。
# Pull Request：只构建 dev Release 并上传 Actions artifact，不向 Release 写入内容。
# 这里完全不使用 assembleDebug；dev 是独立的非 Debug 构建类型。
# ============================================================
name: Android Dev Release

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev, main ]
  workflow_dispatch:

# 构建任务只读仓库；发布任务单独申请 contents: write 创建 rolling Release。
# 版本号和更新日志已经由本地脚本提交，云端不再修改或回写代码。
permissions:
  contents: read

concurrency:
  group: android-dev-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'

jobs:
  build-dev:
    name: Build dev Release APK
    # PR 必须允许普通提交进入构建检查；dev push 则要求最后一个提交是本地发布脚本
    # 生成的版本提交，避免用户忘记准备版本时云端重复发布旧版本。
    if: >-
      github.event_name == 'pull_request' ||
      (github.ref == 'refs/heads/dev' &&
      (github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'chore(dev): prepare v')))
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read local release metadata
        id: version
        run: |
          version_name="$(awk -F= '$1 == "VERSION_NAME" { print $2; exit }' version.properties)"
          version_code="$(awk -F= '$1 == "VERSION_CODE" { print $2; exit }' version.properties)"
          [[ "$version_name" =~ ^0\.1\.[0-9]+$ ]]
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]]
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "使用本地提交中的版本：$version_name (versionCode $version_code)"

      - name: Validate local dev preparation
        if: github.event_name == 'push'
        run: |
          expected="chore(dev): prepare v${{ steps.version.outputs.version_name }}"
          actual="$(git log -1 --pretty=%s)"
          test "$actual" = "$expected" || {
            echo "最后一个提交必须是：$expected" >&2
            echo "实际提交是：$actual" >&2
            exit 1
          }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM unit tests
        # Chat 的 MockWebServer 测试依赖 Dispatchers.IO；串行执行各模块测试，避免 CI 高负载时出现调度超时。
        run: sh gradlew test --no-parallel --console=plain

      - name: Run Android lint
        run: sh gradlew :app:lintDev --console=plain

      # PR 只做构建验证，不读取发布签名；dev 分支真正发布时必须使用稳定签名。
      # 这样既不会让普通 PR 因为没有 Secrets 而无法验证，又不会把临时 debug 签名的 APK
      # 误当成可以长期升级的 dev-latest 发布包。
      - name: Check dev release signing secrets
        if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing KEYSTORE_BASE64' >&2; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing KEYSTORE_PASSWORD' >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing KEY_ALIAS' >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing KEY_PASSWORD' >&2; exit 1; }

      - name: Decode stable dev signing keystore
        if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # keystore 只存在于本次 runner 生命周期，不进入仓库，也不上传为 artifact。
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          test -s keystore.jks

      - name: Build dev APK for PR validation
        if: github.event_name == 'pull_request'
        # PR 只验证非 Debug 的 dev 构建，不把发布签名 Secrets 注入 Gradle 进程；该产物不作为用户升级包。
        run: sh gradlew :app:assembleDev --console=plain

      - name: Build stably signed dev Release APKs
        if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          KEYSTORE_FILE: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: sh gradlew :app:assembleDev --console=plain

      - name: Upload dev APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanobotkt-dev-${{ github.sha }}
          path: app/build/outputs/apk/dev/*.apk
          if-no-files-found: error
          retention-days: 14

  publish-dev:
    name: Publish rolling dev Release
    needs: build-dev
    # 只有 dev 分支 push/手动运行会进入此发布 job，并更新滚动 Release。
    permissions:
      contents: write
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 发布任务直接读取触发构建的 dev 提交；该提交已经包含本地准备好的版本和日志。
          ref: dev
          fetch-depth: 0
          fetch-tags: true

      - name: Read local release metadata
        id: version
        run: |
          version_name="$(awk -F= '$1 == "VERSION_NAME" { print $2; exit }' version.properties)"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Download dev APK artifact
        uses: actions/download-artifact@v4
        with:
          name: nanobotkt-dev-${{ github.sha }}
          path: release-assets

      - name: Publish dev-latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # dev 只保留一个滚动预发布版本，避免每次开发提交都堆积正式 Release。
          gh release delete dev-latest --yes --cleanup-tag 2>/dev/null || true
          target_sha="$(git rev-parse HEAD)"
          gh release create dev-latest release-assets/*.apk \
            --target "$target_sha" \
            --title "NanobotKT dev latest (${{ steps.version.outputs.version_name }}-dev)" \
            --notes-file docs/CHANGELOG.md \
            --prerelease
