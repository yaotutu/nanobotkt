# ============================================================
# NanobotKT Dev Release workflow
#
# dev 分支：构建并更新一个 rolling 的 dev-latest 预发布版本。
# Pull Request：只构建 dev Release 并上传 Actions artifact，不向 Release 写入内容。
# 这里完全不使用 assembleDebug；dev 是独立的非 Debug 构建类型。
# ============================================================
name: Android Dev Release

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev, main ]
  workflow_dispatch:

# 默认只读；构建 dev 的 job 仅为回写自动递增版本而提升 contents: write，PR 不会执行回写步骤。
permissions:
  contents: read

concurrency:
  group: android-dev-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'

jobs:
  build-dev:
    name: Build dev Release APK
    # 版本提交只用于保存下一次发布版本，不应再次触发完整构建，避免 CI 无限循环。
    # pull_request 的 github.ref 是 refs/pull/...，不能用分支 ref 判断，否则 PR 会被错误跳过。
    if: >-
      github.event_name == 'pull_request' ||
      (github.ref == 'refs/heads/dev' &&
      (github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(dev): prepare ')))
    permissions:
      # dev push 需要把自动递增后的版本文件推回 dev；PR 的令牌仍由 GitHub 按来源仓库权限限制。
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # 版本号由 CI 在真正发布前递增；自动生成的版本提交会被 workflow 条件跳过，避免循环构建。
      - name: Configure Git identity
        if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Bump dev version and generate changelog
        id: version
        if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          result="$(./scripts/release.sh bump)"
          echo "$result"
          version_name="$(echo "$result" | awk -F= '$1 == "VERSION_NAME" { print $2 }')"
          version_code="$(echo "$result" | awk -F= '$1 == "VERSION_CODE" { print $2 }')"
          test -n "$version_name"
          test -n "$version_code"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          ./scripts/release.sh changelog "$version_name"

      - name: Commit dev version and changelog
        if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          git add version.properties docs/CHANGELOG.md
          git commit -m "chore(dev): prepare v${{ steps.version.outputs.version_name }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM unit tests
        run: sh gradlew test --console=plain

      - name: Run Android lint
        run: sh gradlew :app:lintDev --console=plain

      # PR 只做构建验证，不读取发布签名；dev 分支真正发布时必须使用稳定签名。
      # 这样既不会让普通 PR 因为没有 Secrets 而无法验证，又不会把临时 debug 签名的 APK
      # 误当成可以长期升级的 dev-latest 发布包。
      - name: Check dev release signing secrets
        if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing KEYSTORE_BASE64' >&2; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing KEYSTORE_PASSWORD' >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing KEY_ALIAS' >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing KEY_PASSWORD' >&2; exit 1; }

      - name: Decode stable dev signing keystore
        if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # keystore 只存在于本次 runner 生命周期，不进入仓库，也不上传为 artifact。
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          test -s keystore.jks

      - name: Build dev APK for PR validation
        if: github.event_name == 'pull_request'
        # PR 只验证非 Debug 的 dev 构建，不把发布签名 Secrets 注入 Gradle 进程；该产物不作为用户升级包。
        run: sh gradlew :app:assembleDev --console=plain

      - name: Build stably signed dev Release APKs
        if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          KEYSTORE_FILE: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: sh gradlew :app:assembleDev --console=plain

      - name: Upload dev APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanobotkt-dev-${{ github.sha }}
          path: app/build/outputs/apk/dev/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Push dev version commit
        if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: git push origin HEAD:dev

  publish-dev:
    name: Publish rolling dev Release
    needs: build-dev
    # 只有 dev 分支 push/手动运行会进入此发布 job，并更新滚动 Release。
    permissions:
      contents: write
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 版本递增提交已经推送回 dev；发布任务读取该提交中的版本号和更新日志。
          ref: dev
          fetch-depth: 0
          fetch-tags: true

      - name: Download dev APK artifact
        uses: actions/download-artifact@v4
        with:
          name: nanobotkt-dev-${{ github.sha }}
          path: release-assets

      - name: Publish dev-latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # dev 只保留一个滚动预发布版本，避免每次开发提交都堆积正式 Release。
          gh release delete dev-latest --yes --cleanup-tag 2>/dev/null || true
          target_sha="$(git rev-parse HEAD)"
          gh release create dev-latest release-assets/*.apk \
            --target "$target_sha" \
            --title "NanobotKT dev latest" \
            --notes-file docs/CHANGELOG.md \
            --prerelease
