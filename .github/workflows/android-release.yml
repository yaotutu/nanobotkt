# ============================================================
# NanobotKT 自动发布 workflow
# 作用：当推送 v* 版本标签（如 v1.0.0）时，自动构建 Android
#       Debug APK，并创建对应的 GitHub Release，把 APK 作为
#       资产（asset）附在 Release 上，实现「打标签即发布」。
# 注意：本文件只负责 CI 构建与发布，不修改任何应用源码。
# ============================================================
name: Android Release

on:
  push:
    # 只有推送 v 开头的标签（v1.0.0、v1.2.3 等）才触发发布
    tags:
      - 'v*'

# 发布 Release 需要写权限（contents: write），由 GITHUB_TOKEN 提供
permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    steps:
      # 1. 检出仓库代码（tag 对应的提交）
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. 配置 Gradle（自动使用仓库 wrapper，并缓存依赖）
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. 构建 Debug APK（可直接安装；未配置正式签名时 debug 产物可安装）
      - name: Build debug APK
        run: sh gradlew :app:assembleDebug --console=plain

      # 5. 创建/更新当前 tag 对应的 GitHub Release 并上传 APK
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          # 自动生成 release notes（基于 commit/PR 标题）
          generate_release_notes: true
