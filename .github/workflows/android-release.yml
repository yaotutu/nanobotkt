# ============================================================
# NanobotKT 自动发布 workflow（开发期「无脑发布」版）
# 作用：开发阶段不打版本标签，任何 push 到 main 的提交都会：
#       1. 跑全工程 JVM 单元测试
#       2. 构建已签名的 Release APK（按架构拆分 + universal 通用包）
#       3. 发布/更新到一个固定的「latest」GitHub Release
# 这样仓库里永远只有一个 latest Release，始终指向最新构建产物。
# 注意：本文件只负责 CI 构建与发布，不修改任何应用源码。
# ============================================================
name: Android Release

on:
  push:
    branches: [ main ]
  # 也允许在 GitHub Actions 页面手动触发
  workflow_dispatch:

# 发布 Release 需要写权限（contents: write），由 GITHUB_TOKEN 提供
permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    steps:
      # 1. 检出仓库代码（当前提交）
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. 配置 Gradle（自动使用仓库 wrapper，并缓存依赖）
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. 先执行全工程 JVM 单元测试，避免仅编译成功却漏掉通信和业务回归。
      - name: Run JVM unit tests
        run: sh gradlew test --console=plain

      # 5. 从 GitHub Secret 解出签名 keystore（base64 -> keystore.jks）
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

      # 6. 构建已签名的 Release APK（按架构拆分 + universal 通用包）
      - name: Build signed release APKs
        env:
          KEYSTORE_FILE: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: sh gradlew :app:assembleRelease --console=plain

      # 7. 无脑发布：删除旧的 latest Release，再创建新的 latest Release，
      #    上传全部 APK（arm64-v8a / armeabi-v7a / x86 / x86_64 / universal）。
      #    下载链接固定：https://github.com/yaotutu/nanobotkt/releases/tag/latest
      - name: Publish to rolling latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes >/dev/null 2>&1 || true
          gh release create latest app/build/outputs/apk/release/*.apk \
            --title "Latest dev build" \
            --notes "自动化开发构建：commit \`${{ github.sha }}\`"
