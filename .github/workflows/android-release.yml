# ============================================================
# NanobotKT 正式 Release workflow
# 作用：main 分支每次 push 后自动递增版本、生成更新日志、构建正式 Release APK，
#       然后创建对应版本的 GitHub Release。
# ============================================================
name: Android Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# 避免多个 main push 同时递增同一个版本号。
concurrency:
  group: android-release-main
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'

jobs:
  release:
    name: Build and publish formal Release
    # 手动运行也只允许 main：否则从其他分支 dispatch 后把 HEAD 推到 main，可能发布错误源码。
    # Actions 版本提交默认不会再次触发发布；提交前缀保护用于未来改用 PAT 后避免循环。
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore(release): prepare '))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure Git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Bump version and generate changelog
        id: version
        run: |
          result="$(./scripts/release.sh bump)"
          echo "$result"
          version_name="$(echo "$result" | awk -F= '$1 == "VERSION_NAME" { print $2 }')"
          version_code="$(echo "$result" | awk -F= '$1 == "VERSION_CODE" { print $2 }')"
          test -n "$version_name"
          test -n "$version_code"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          ./scripts/release.sh changelog "$version_name"

      - name: Commit version and changelog locally
        run: |
          git add version.properties docs/CHANGELOG.md
          git commit -m "chore(release): prepare v${{ steps.version.outputs.version_name }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM unit tests
        run: sh gradlew test --console=plain

      - name: Run Android lint
        run: sh gradlew :app:lintRelease --console=plain

      - name: Check formal signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing KEYSTORE_BASE64' >&2; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing KEYSTORE_PASSWORD' >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing KEY_ALIAS' >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing KEY_PASSWORD' >&2; exit 1; }

      - name: Decode formal signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks

      - name: Build formal Release APKs
        env:
          KEYSTORE_FILE: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: sh gradlew :app:assembleRelease --console=plain

      - name: Push version and changelog commit
        run: git push origin HEAD:main

      - name: Upload formal APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nanobotkt-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version_name }}" \
            app/build/outputs/apk/release/*.apk \
            --target main \
            --title "NanobotKT v${{ steps.version.outputs.version_name }}" \
            --notes-file docs/CHANGELOG.md
