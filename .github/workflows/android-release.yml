# ============================================================
# NanobotKT 自动发布 workflow
# 作用：当推送 v* 版本标签（如 v1.0.0）时，自动构建已签名的 Android
#       Release APK（按架构拆分 + universal 通用包），并创建对应的
#       GitHub Release，把所有 APK 作为资产附在 Release 上，实现
#       「打标签即发布」。
# 注意：本文件只负责 CI 构建与发布，不修改任何应用源码。
# ============================================================
name: Android Release

on:
  push:
    # 只有推送 v 开头的标签（v1.0.0、v1.2.3 等）才触发发布
    tags:
      - 'v*'

# 发布 Release 需要写权限（contents: write），由 GITHUB_TOKEN 提供
permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    steps:
      # 1. 检出仓库代码（tag 对应的提交）
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. 配置 Gradle（自动使用仓库 wrapper，并缓存依赖）
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. 先执行全工程 JVM 单元测试，避免仅编译成功却漏掉通信和业务回归。
      - name: Run JVM unit tests
        run: sh gradlew test --console=plain

      # 5. 从 GitHub Secret 解出签名 keystore（base64 -> keystore.jks）
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

      # 5. 构建已签名的 Release APK（按架构拆分 + universal 通用包）
      - name: Build signed release APKs
        env:
          KEYSTORE_FILE: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: sh gradlew :app:assembleRelease --console=plain

      # 7. 创建/更新当前 tag 对应的 GitHub Release，上传全部 APK：
      #    app-arm64-v8a-release.apk / app-armeabi-v7a-release.apk /
      #    app-x86-release.apk / app-x86_64-release.apk / app-universal-release.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          # 自动生成 release notes（基于 commit/PR 标题）
          generate_release_notes: true
