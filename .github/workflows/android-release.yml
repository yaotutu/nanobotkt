# ============================================================
# NanobotKT 正式 Release workflow
# 作用：main 分支读取本地已经准备好的版本，执行测试、构建和正式发布。
#       版本号与更新日志不在云端生成，避免远端回写造成开发者本地仓库不一致。
# ============================================================
name: Android Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 正式 Release 需要写权限创建 GitHub Release；不会写回仓库代码。
permissions:
  contents: write

concurrency:
  group: android-release-main
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'

jobs:
  release:
    name: Build and publish formal Release
    # main push 必须来自本地 release.sh prepare release 生成的版本提交；手动运行用于
    # 重试当前已准备好的提交，因此不再自动 bump，也不会产生云端版本提交。
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'chore(release): prepare v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read local release metadata
        id: version
        run: |
          version_name="$(awk -F= '$1 == "VERSION_NAME" { print $2; exit }' version.properties)"
          version_code="$(awk -F= '$1 == "VERSION_CODE" { print $2; exit }' version.properties)"
          [[ "$version_name" =~ ^0\.1\.[0-9]+$ ]]
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]]
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "使用本地提交中的版本：$version_name (versionCode $version_code)"

      - name: Validate local release preparation
        if: github.event_name == 'push'
        run: |
          expected="chore(release): prepare v${{ steps.version.outputs.version_name }}"
          actual="$(git log -1 --pretty=%s)"
          test "$actual" = "$expected" || {
            echo "最后一个提交必须是：$expected" >&2
            echo "实际提交是：$actual" >&2
            exit 1
          }

      - name: Check release tag is available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version_name }}"
          # 同时检查 Release 和 Git tag：只检查 Release 会漏掉“tag 已存在但 Release 被删除”的情况，
          # 后续 gh release create 仍会因 tag 冲突失败，导致本地版本与云端状态难以判断。
          if gh release view "$tag" >/dev/null 2>&1 || git ls-remote --exit-code --refs origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Release 或 tag $tag 已存在，请先在本地递增版本号。" >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM unit tests
        run: sh gradlew test --console=plain

      - name: Run Android lint
        run: sh gradlew :app:lintRelease --console=plain

      - name: Check formal signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing KEYSTORE_BASE64' >&2; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing KEYSTORE_PASSWORD' >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing KEY_ALIAS' >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing KEY_PASSWORD' >&2; exit 1; }

      - name: Decode formal signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks

      - name: Build formal Release APKs
        env:
          KEYSTORE_FILE: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: sh gradlew :app:assembleRelease --console=plain

      - name: Upload formal APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nanobotkt-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version_name }}" \
            app/build/outputs/apk/release/*.apk \
            --target "${GITHUB_SHA}" \
            --title "NanobotKT v${{ steps.version.outputs.version_name }}" \
            --notes-file docs/CHANGELOG.md
